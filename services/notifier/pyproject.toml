[project]
name = "jarvis-notifier"
version = "0.1.0"
description = "Jarvis notifier service"
requires-python = ">=3.13"
dependencies = [
    "jarvis-core",
]

[tool.uv.sources]
jarvis-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notifier"]
