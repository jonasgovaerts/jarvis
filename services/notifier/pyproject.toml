[project]
name = "jarvis-notifier"
version = "0.1.0"
description = "Consumes JARVIS_EVENTS and delivers notifications (Discord first)"
requires-python = ">=3.13"
dependencies = [
    "jarvis-core[db]",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[tool.uv.sources]
jarvis-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notifier"]
