[project]
name = "jarvis-issue-watcher"
version = "0.1.0"
description = "Polls forge issues and creates WorkItem CRs idempotently"
requires-python = ">=3.13"
dependencies = [
    "jarvis-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[tool.uv.sources]
jarvis-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/issue_watcher"]
