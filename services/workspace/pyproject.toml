[project]
name = "jarvis-workspace"
version = "0.1.0"
description = "Gmail integration: classify, label, create tasks, draft replies"
requires-python = ">=3.13"
dependencies = [
    "jarvis-core[llm,db]",
    "google-api-python-client>=2.150",
    "google-auth>=2.36",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[tool.uv.sources]
jarvis-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workspace"]
