[project]
name = "jarvis-gateway"
version = "0.1.0"
description = "Jarvis API gateway: REST + WebSocket + chat + K8s watcher"
requires-python = ">=3.13"
dependencies = [
    "jarvis-core[llm,db]",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "kubernetes-asyncio>=31.0",
    "websockets>=14.0",
]

[tool.uv.sources]
jarvis-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
