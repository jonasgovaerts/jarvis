apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: jarvis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
    spec:
      serviceAccountName: gateway
      containers:
        - name: gateway
          image: ghcr.io/jonasgovaerts/jarvis/gateway:latest # pinned by deploy-bump in the overlay
          ports:
            - containerPort: 8000
          env:
            - name: NATS_URL
              value: nats://nats.jarvis-platform.svc:4222
            - name: LLM_BASE_URL
              value: http://litellm.jarvis-platform.svc:4000
            - name: CHAT_MODEL
              value: gemini
            # Mirrors workspace's MAIL_ENABLED — keep in sync; hides mail UI.
            - name: MAIL_ENABLED
              value: "false"
            # SPA does OIDC (code+PKCE) against authentik; gateway validates
            # the JWTs. The bearer token still works for port-forward access.
            - name: AUTH_MODE
              value: oidc
            - name: OIDC_ISSUER
              value: https://authentik.jonasg.be/application/o/jarvis/
            - name: OIDC_CLIENT_ID
              value: ee4rq50N7419Ih9dXjDc1mBOZzWVmUMTCqNVG3IY
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-agent-key
                  key: key
            - name: JARVIS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gateway-auth
                  key: token
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: jarvis-db
                  key: gatewayUrl
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: 8000
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 8000
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
