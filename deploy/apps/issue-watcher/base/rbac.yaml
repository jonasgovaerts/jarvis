apiVersion: v1
kind: ServiceAccount
metadata:
  name: issue-watcher
  namespace: jarvis-system
---
# Operates on CRs and repo-token secrets in the `jarvis` namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jarvis-issue-watcher
  namespace: jarvis
rules:
  - apiGroups: ["jarvis.dev"]
    resources: ["managedrepositories"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["jarvis.dev"]
    resources: ["managedrepositories/status"]
    verbs: ["patch"]
  - apiGroups: ["jarvis.dev"]
    resources: ["workitems"]
    verbs: ["get", "list", "create", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jarvis-issue-watcher
  namespace: jarvis
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jarvis-issue-watcher
subjects:
  - kind: ServiceAccount
    name: issue-watcher
    namespace: jarvis-system
