apiVersion: v1
kind: ConfigMap
metadata:
  name: notifier-routing
  namespace: jarvis-system
data:
  routing.yaml: |
    # Discord notifications: analysis complete (needs your approval before
    # development), a PR appearing, the PR becoming mergeable (CI green), and
    # failures. Everything else stays board-only (explicit empty rules).
    rules:
      - match: "jarvis.workflow.analysis.completed"
        channels: [discord]
      - match: "jarvis.workflow.pr.opened"
        channels: [discord]
      - match: "jarvis.workflow.pr.ready"
        channels: [discord]
      - match: "jarvis.workflow.failed"
        channels: [discord]
      - match: "jarvis.>"
        channels: []
    default_channels: []
