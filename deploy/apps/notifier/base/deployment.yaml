apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
  namespace: jarvis-system
  labels:
    app.kubernetes.io/name: notifier
    app.kubernetes.io/part-of: jarvis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notifier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notifier
    spec:
      containers:
        - name: notifier
          image: ghcr.io/jonasgovaerts/jarvis/notifier:latest # pinned by deploy-bump
          ports:
            - containerPort: 8000
          env:
            - name: NATS_URL
              value: nats://nats.jarvis-platform.svc:4222
            - name: DASHBOARD_URL
              value: https://jarvis.homelab.jonasg.be
            - name: ROUTING_CONFIG_PATH
              value: /etc/jarvis/routing.yaml
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: jarvis-db
                  key: notifierUrl
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: discord-webhook
                  key: url
                  optional: true
          volumeMounts:
            - name: routing
              mountPath: /etc/jarvis
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 8000
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 256Mi
      volumes:
        - name: routing
          configMap:
            name: notifier-routing
