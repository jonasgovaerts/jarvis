# Identity agent Jobs run as: read its WorkItem/ManagedRepository, write
# artifact ConfigMaps. Lives in the `jarvis` namespace where Jobs run.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jarvis-agent
  namespace: jarvis
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jarvis-agent
  namespace: jarvis
rules:
  - apiGroups: ["jarvis.dev"]
    resources: ["workitems", "managedrepositories"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jarvis-agent
  namespace: jarvis
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jarvis-agent
subjects:
  - kind: ServiceAccount
    name: jarvis-agent
    namespace: jarvis
