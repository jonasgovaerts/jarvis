apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../operator/config/default
  - agent-rbac.yaml
patches:
  - path: manager-env-patch.yaml
    target:
      kind: Deployment
      name: controller-manager
images:
  - name: controller
    newName: ghcr.io/jonasgovaerts/jarvis/operator
    newTag: sha-277254f
# Name-hashed so any change rolls the operator automatically (it reads these
# as env at startup). deploy-bump rewrites the agentImage literal with yq.
configMapGenerator:
  - literals:
      - agentImage=ghcr.io/jonasgovaerts/jarvis/agents:sha-34ee0fa
      - defaultModel=gemini
      - llmBaseUrl=http://litellm.jarvis-platform.svc:4000
    name: jarvis-defaults
    namespace: jarvis-operator-system
