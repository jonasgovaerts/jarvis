apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: jarvis-system
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: jarvis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/jonasgovaerts/jarvis/frontend:latest # pinned by deploy-bump
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
