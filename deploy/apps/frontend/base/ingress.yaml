# Auth happens in the app (OIDC against authentik), not at the edge: the SPA
# runs authorization-code+PKCE and the gateway validates JWTs via JWKS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jarvis
  namespace: jarvis-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    external-dns.alpha.kubernetes.io/hostname: jarvis.homelab.jonasg.be
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: jarvis.homelab.jonasg.be
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
    - host: jarvis.jonasg.be
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
  tls:
    - hosts:
        - jarvis.homelab.jonasg.be
        - jarvis.jonasg.be
      secretName: jarvis-tls
