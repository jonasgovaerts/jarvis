apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/jonasgovaerts/jarvis
    targetRevision: main
    path: deploy/platform/postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: jarvis-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
