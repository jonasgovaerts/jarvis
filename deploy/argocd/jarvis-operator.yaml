apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jarvis-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/jonasgovaerts/jarvis
    targetRevision: main
    path: deploy/apps/operator
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true # CRDs with large schemas
