# App-of-apps root. The ONLY manifest ever applied by hand:
#   kubectl apply -f deploy/argocd/jarvis-root.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jarvis-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jonasgovaerts/jarvis
    targetRevision: main
    path: deploy/argocd
    directory:
      exclude: jarvis-root.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
