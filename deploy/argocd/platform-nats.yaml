apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-nats
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://nats-io.github.io/k8s/helm/charts
    chart: nats
    targetRevision: 1.3.x
    helm:
      valuesObject:
        config:
          jetstream:
            enabled: true
            fileStore:
              pvc:
                size: 5Gi
        # Single replica is fine for a single-user homelab; JetStream file
        # storage survives pod restarts via the PVC.
  destination:
    server: https://kubernetes.default.svc
    namespace: jarvis-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
