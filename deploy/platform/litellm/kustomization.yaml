apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jarvis-platform
resources:
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: litellm-config
    files:
      - config.yaml
# The provider keys + master key arrive as SealedSecret `litellm-keys`
# (created via `make seal`), with keys: ANTHROPIC_API_KEY, OPENAI_API_KEY,
# GEMINI_API_KEY, LITELLM_MASTER_KEY.
