# This rule is not used by the project jarvis-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to jarvis.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: jarvis-operator
    app.kubernetes.io/managed-by: kustomize
  name: managedrepository-viewer-role
rules:
- apiGroups:
  - jarvis.dev
  resources:
  - managedrepositories
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - jarvis.dev
  resources:
  - managedrepositories/status
  verbs:
  - get
