# This rule is not used by the project jarvis-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the jarvis.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: jarvis-operator
    app.kubernetes.io/managed-by: kustomize
  name: workitem-editor-role
rules:
- apiGroups:
  - jarvis.dev
  resources:
  - workitems
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - jarvis.dev
  resources:
  - workitems/status
  verbs:
  - get
