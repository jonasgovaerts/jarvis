---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - pods
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - jarvis.dev
  resources:
  - managedrepositories
  - workitems
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - jarvis.dev
  resources:
  - managedrepositories/finalizers
  - workitems/finalizers
  verbs:
  - update
- apiGroups:
  - jarvis.dev
  resources:
  - managedrepositories/status
  - workitems/status
  verbs:
  - get
  - patch
  - update
