# Monorepo CI: one workflow, path-filtered fan-out. Jobs skip green when their
# component didn't change (keeps required status checks usable, unlike per-
# workflow `on.paths`). Image builds run on pushes to main/development.
name: CI

on:
  pull_request:
  push:
    branches: [main, development]
    tags: ["v*"]
    paths-ignore:
      - "deploy/**" # deploy-bump commits must not retrigger CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      contracts: ${{ steps.filter.outputs.contracts }}
      operator: ${{ steps.filter.outputs.operator }}
      frontend: ${{ steps.filter.outputs.frontend }}
      gateway: ${{ steps.filter.outputs.gateway }}
      notifier: ${{ steps.filter.outputs.notifier }}
      issue-watcher: ${{ steps.filter.outputs.issue-watcher }}
      workspace: ${{ steps.filter.outputs.workspace }}
      agents: ${{ steps.filter.outputs.agents }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # libs/** flips every Python component: services vendor jarvis-core.
          filters: |
            python:
              - "libs/jarvis-core/**"
              - "pyproject.toml"
              - "uv.lock"
              - "agents/**"
              - "services/**"
            contracts:
              - "libs/jarvis-core/**"
              - "schemas/**"
              - "libs/ts/jarvis-events/**"
              - "tools/codegen.py"
            operator:
              - "operator/**"
            frontend:
              - "frontend/**"
              - "libs/ts/jarvis-events/**"
            gateway: &core
              - "libs/jarvis-core/**"
              - "uv.lock"
              - "services/gateway/**"
            notifier:
              - *core
              - "services/notifier/**"
            issue-watcher:
              - *core
              - "services/issue-watcher/**"
            workspace:
              - *core
              - "services/workspace/**"
            agents:
              - *core
              - "agents/**"

  lint-test-python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  contracts-drift:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync --frozen
      - run: npm --prefix libs/ts/jarvis-events ci
      - run: make codegen
      - name: Fail on generated-contract drift
        run: git diff --exit-code schemas/ libs/ts/jarvis-events/src/generated/

  lint-test-operator:
    needs: changes
    if: needs.changes.outputs.operator == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum
      # The repo pins golangci-lint v2 + a custom logcheck plugin; the Makefile
      # target builds the right binary (the marketplace action installs v1).
      - run: make -C operator lint
      - run: make -C operator test
      - name: Fail on CRD/RBAC manifest drift
        run: |
          make -C operator manifests generate
          git diff --exit-code operator/config/ operator/api/

  lint-test-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Typecheck shared events package
        run: |
          npm --prefix libs/ts/jarvis-events ci
          npm --prefix libs/ts/jarvis-events run typecheck
      - name: Lint, typecheck, test, build frontend
        if: hashFiles('frontend/package.json') != ''
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run lint
          npm --prefix frontend run typecheck
          npm --prefix frontend run test -- --run
          npm --prefix frontend run build

  # --- image builds (push to main/development and v* tags only) -------------

  build-gateway:
    needs: [changes, lint-test-python]
    if: github.event_name == 'push' && needs.changes.outputs.gateway == 'true'
    uses: ./.github/workflows/build-image.yaml
    permissions:
      contents: read
      packages: write
    with:
      component: gateway
      dockerfile: services/gateway/Dockerfile

  build-issue-watcher:
    needs: [changes, lint-test-python]
    if: github.event_name == 'push' && needs.changes.outputs.issue-watcher == 'true'
    uses: ./.github/workflows/build-image.yaml
    permissions:
      contents: read
      packages: write
    with:
      component: issue-watcher
      dockerfile: services/issue-watcher/Dockerfile

  build-notifier:
    needs: [changes, lint-test-python]
    if: github.event_name == 'push' && needs.changes.outputs.notifier == 'true'
    uses: ./.github/workflows/build-image.yaml
    permissions:
      contents: read
      packages: write
    with:
      component: notifier
      dockerfile: services/notifier/Dockerfile

  build-frontend:
    needs: [changes, lint-test-frontend]
    if: github.event_name == 'push' && needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/build-image.yaml
    permissions:
      contents: read
      packages: write
    with:
      component: frontend
      dockerfile: frontend/Dockerfile

  build-workspace:
    needs: [changes, lint-test-python]
    if: github.event_name == 'push' && needs.changes.outputs.workspace == 'true'
    uses: ./.github/workflows/build-image.yaml
    permissions:
      contents: read
      packages: write
    with:
      component: workspace
      dockerfile: services/workspace/Dockerfile

  build-agents:
    needs: [changes, lint-test-python]
    if: github.event_name == 'push' && needs.changes.outputs.agents == 'true'
    uses: ./.github/workflows/build-image.yaml
    permissions:
      contents: read
      packages: write
    with:
      component: agents
      dockerfile: agents/Dockerfile

  build-operator:
    needs: [changes, lint-test-operator]
    if: github.event_name == 'push' && needs.changes.outputs.operator == 'true'
    uses: ./.github/workflows/build-image.yaml
    permissions:
      contents: read
      packages: write
    with:
      component: operator
      dockerfile: operator/Dockerfile

  # --- gitops image pin (main only; ArgoCD picks the commit up) -------------

  deploy-bump:
    needs:
      [
        changes,
        build-gateway,
        build-agents,
        build-operator,
        build-issue-watcher,
        build-notifier,
        build-frontend,
        build-workspace,
      ]
    if: >-
      github.ref == 'refs/heads/main' && !cancelled() &&
      (needs.build-gateway.result == 'success' ||
       needs.build-agents.result == 'success' ||
       needs.build-operator.result == 'success' ||
       needs.build-issue-watcher.result == 'success' ||
       needs.build-notifier.result == 'success' ||
       needs.build-frontend.result == 'success' ||
       needs.build-workspace.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Pin freshly built images in deploy/
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          if [ "${{ needs.build-gateway.result }}" = "success" ]; then
            (cd deploy/apps/gateway/overlays/prod && kustomize edit set image \
              ghcr.io/${{ github.repository }}/gateway=ghcr.io/${{ github.repository }}/gateway:$TAG)
          fi
          if [ "${{ needs.build-operator.result }}" = "success" ]; then
            (cd deploy/apps/operator && kustomize edit set image \
              controller=ghcr.io/${{ github.repository }}/operator:$TAG)
          fi
          if [ "${{ needs.build-agents.result }}" = "success" ]; then
            yq -i "(.configMapGenerator[0].literals[] | select(test(\"^agentImage=\"))) = \
              \"agentImage=ghcr.io/${{ github.repository }}/agents:$TAG\"" \
              deploy/apps/operator/kustomization.yaml
          fi
          if [ "${{ needs.build-issue-watcher.result }}" = "success" ]; then
            (cd deploy/apps/issue-watcher/overlays/prod && kustomize edit set image \
              ghcr.io/${{ github.repository }}/issue-watcher=ghcr.io/${{ github.repository }}/issue-watcher:$TAG)
          fi
          if [ "${{ needs.build-notifier.result }}" = "success" ]; then
            (cd deploy/apps/notifier/overlays/prod && kustomize edit set image \
              ghcr.io/${{ github.repository }}/notifier=ghcr.io/${{ github.repository }}/notifier:$TAG)
          fi
          if [ "${{ needs.build-frontend.result }}" = "success" ]; then
            (cd deploy/apps/frontend/overlays/prod && kustomize edit set image \
              ghcr.io/${{ github.repository }}/frontend=ghcr.io/${{ github.repository }}/frontend:$TAG)
          fi
          if [ "${{ needs.build-workspace.result }}" = "success" ]; then
            (cd deploy/apps/workspace/overlays/prod && kustomize edit set image \
              ghcr.io/${{ github.repository }}/workspace=ghcr.io/${{ github.repository }}/workspace:$TAG)
          fi
      - name: Commit and push (rebase-retry for concurrent bumps)
        run: |
          git config user.name "jarvis-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "chore(deploy): pin images for ${GITHUB_SHA::7}"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
