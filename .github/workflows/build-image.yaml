# Reusable multi-arch image build: native runners per arch (true parallelism,
# no QEMU), push-by-digest, then a manifest merge. Images land at
# ghcr.io/<owner>/jarvis/<component>:sha-<7> (+ branch tag, + semver on v* tags).
name: build-image

on:
  workflow_call:
    inputs:
      component:
        description: "Image name suffix, e.g. gateway"
        required: true
        type: string
      dockerfile:
        description: "Path to the Dockerfile (context is always the repo root)"
        required: true
        type: string
      amd64-runner:
        type: string
        default: ubuntu-24.04
      arm64-runner:
        # Free for public repos. Escape hatch for private: pass ubuntu-24.04
        # and add a setup-qemu step variant instead.
        type: string
        default: ubuntu-24.04-arm

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ${{ inputs.amd64-runner }}
          - platform: linux/arm64
            arch: arm64
            runner: ${{ inputs.arm64-runner }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}/${{ inputs.component }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ inputs.component }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ inputs.component }}-${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ inputs.component }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ inputs.component }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ inputs.component }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}/${{ inputs.component }}@sha256:%s ' *)

      - name: Inspect
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository }}/${{ inputs.component }}:${{ steps.meta.outputs.version }}
