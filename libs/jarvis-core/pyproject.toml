[project]
name = "jarvis-core"
version = "0.1.0"
description = "Shared contracts for Jarvis: events, agent envelope, settings"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "kubernetes>=31.0",
    "nats-py>=2.9",
]

[project.optional-dependencies]
llm = [
    "pydantic-ai-slim[openai]>=0.4",
]
db = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_core"]
