[project]
name = "jarvis-core"
version = "0.1.0"
description = "Shared contracts for Jarvis: events, agent envelope, settings"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "kubernetes>=31.0",
]

[project.optional-dependencies]
llm = [
    "pydantic-ai-slim[openai]>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_core"]
