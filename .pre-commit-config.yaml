repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.23.3
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: kustomize-build
        name: validate kustomizations in deploy/
        entry: bash -c 'set -e; for d in deploy/platform/*/ deploy/apps/*/overlays/*/; do [ -f "$d/kustomization.yaml" ] && kustomize build "$d" >/dev/null; done'
        language: system
        files: ^deploy/
        pass_filenames: false

      - id: go-fmt-vet
        name: gofmt + go vet (operator)
        entry: bash -c 'cd operator && test -z "$(gofmt -l .)" && go vet ./...'
        language: system
        files: ^operator/.*\.go$
        pass_filenames: false

  # eslint/prettier hooks land with frontend/ .
