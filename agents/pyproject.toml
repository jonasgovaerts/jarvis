[project]
name = "jarvis-agents"
version = "0.1.0"
description = "Jarvis agent runtime: analyzer | developer | devops | sre"
requires-python = ">=3.13"
dependencies = [
    "jarvis-core[llm]",
]

[project.scripts]
jarvis-agent = "jarvis_agents.cli:main"

[tool.uv.sources]
jarvis-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_agents"]
